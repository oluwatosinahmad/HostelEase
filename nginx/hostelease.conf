# ==============================================================================
# HOSTEL EASE — PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# ==============================================================================
# Place this file in: /etc/nginx/sites-available/hostelease.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/hostelease.conf /etc/nginx/sites-enabled/
# Test with: sudo nginx -t
# Reload with: sudo systemctl reload nginx

# Rate Limiting Zone (protects backend from abusive traffic / spam)
limit_req_zone $binary_remote_addr zone=hostelease_limit:10m rate=30r/s;

# ------------------------------------------------------------------------------
# HTTP SERVER (Port 80)
# Handles initial domain traffic and proxies to Node.js / Express (Port 5000)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    # Replace YOUR_DOMAIN.COM with your actual domain or VPS IP address:
    # Example: server_name mycampusapp.com www.mycampusapp.com; or server_name _;
    server_name YOUR_DOMAIN.COM www.YOUR_DOMAIN.COM _;

    # Client Request Body Size (allows hostel photo & media uploads up to 50MB)
    client_max_body_size 50M;

    # Gzip Compression for fast delivery across student mobile connections
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse Proxy to PM2 Node.js process on localhost:5000
    location / {
        limit_req zone=hostelease_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # Static Media Uploads Caching
    location /uploads/ {
        alias /var/www/hostel-ease/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

