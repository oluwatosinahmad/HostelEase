# Netlify Production Configuration for Hostel Ease (LAUTECH)
[build]
  command = "npm run build"
  publish = "dist"

# Proxy all /api/* requests to the production cloud engine
[[redirects]]
  from = "/api/*"
  to = "https://hostelease.oluwatosinahmad.workers.dev/api/:splat"
  status = 200
  force = true

# Proxy uploaded media (images and 4K videos) to the cloud storage
[[redirects]]
  from = "/uploads/*"
  to = "https://hostelease.oluwatosinahmad.workers.dev/uploads/:splat"
  status = 200
  force = false

# SPA Routing: Rewrite all other routes to index.html with HTTP 200 OK
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-Control: Ensure immediate updates for index.html and service worker
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Long-term caching for immutable hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
