# Render Blueprint Specification
services:
  - type: web
    name: hostelease
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: AUTH_JWT_SECRET
        generateValue: true


